appId: io.github.shukry7.sshdrop
productName: SSHDrop
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/@img/**/*
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
npmRebuild: false
artifactName: SSHDrop-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  identity: '-'
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
linux:
  category: Development
  maintainer: SSHDrop contributors
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
