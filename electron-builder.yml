appId: io.github.shukry7.sshdrop
productName: SSHDrop
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
artifactName: SSHDrop-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
linux:
  category: Development
  maintainer: SSHDrop contributors
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
