name: Feature request
description: Propose a focused addition to the SSHDrop workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should this behave, including failure cases?
    validations:
      required: true
