name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare sandboxed Electron on Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-sandbox.sh
      - name: Metadata, formatting, lint, types, regression coverage, and production build
        run: npm run check
      - name: Desktop regression tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Desktop regression tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Verify native application packaging
        run: npm exec electron-builder -- --dir --publish never
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            coverage/
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
