name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability policy
        run: npm run security:audit
      - name: Tracked-file secret scan
        run: npm run security:secrets
      - name: Prepare sandboxed Electron on Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-sandbox.sh
      - name: Metadata, formatting, lint, types, regression coverage, and production build
        run: npm run check
      - name: Desktop regression tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Desktop regression tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Verify native application packaging
        run: npm exec electron-builder -- --publish never
      - name: Inspect security fuses in packaged binaries
        run: npm run security:package
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            coverage/
            artifacts/*.png
            artifacts/dependency-audit.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-artifacts:
    name: Verify diagnostic artifact downloads
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: diagnostics-*
          path: downloaded-diagnostics
      - name: Verify coverage artifacts from all three platforms
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for (const os of ['ubuntu-24.04', 'windows-latest', 'macos-15']) {
            const path = `downloaded-diagnostics/diagnostics-${os}/coverage/coverage-summary.json`;
            const summary = JSON.parse(readFileSync(path, 'utf8'));
            assert(summary.total.lines.total > 0, `Missing coverage data for ${os}`);
            assert(summary.total.lines.covered > 0, `Empty coverage data for ${os}`);
            console.log(`Verified diagnostic artifact: ${os}`);
          }
          NODE
