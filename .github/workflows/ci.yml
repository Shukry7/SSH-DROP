name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_releases:
        description: Inspect two existing Mac releases instead of rebuilding
        type: boolean
        default: false
      baseline:
        description: Working release tag
        type: string
        default: v0.2.0-alpha.2
      suspect:
        description: Reported broken release tag
        type: string
        default: v0.2.0-alpha.5

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || !inputs.inspect_releases
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability policy
        run: npm run security:audit
      - name: Tracked-file secret scan
        run: npm run security:secrets
      - name: Prepare sandboxed Electron on Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/ci-linux-sandbox.sh
      - name: Metadata, formatting, lint, types, regression coverage, and production build
        run: npm run check
      - name: Desktop regression tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Desktop regression tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Verify native application packaging
        env:
          # Explicit ad-hoc identity only; no signing certificate or secret is provided.
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm exec electron-builder -- --publish never
      - name: Inspect security fuses in packaged binaries
        run: npm run security:package
      - name: Verify macOS signatures, DMG contents and packaged startup
        if: runner.os == 'macOS'
        run: npm run security:mac-package
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            coverage/
            artifacts/*.png
            artifacts/dependency-audit.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9

  inspect-mac-releases:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_releases
    name: Inspect existing Mac release integrity
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Compare existing DMGs without changing them
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline }}
          SUSPECT_TAG: ${{ inputs.suspect }}
        run: node scripts/inspect-mac-releases.mjs "$BASELINE_TAG" "$SUSPECT_TAG"
